title: AI/ML Course Notes
author: Ujjwal
logo: ""

execute:
  execute_notebooks: "off"   # notebooks are pre-executed; rebuild will just render saved outputs

html:
  use_repository_button: true
  use_issues_button: true
  use_edit_page_button: true
  extra_navbar: ""

repository:
  url: https://github.com/Ujjwal091/ai-ml-course
  branch: main

launch_buttons:
  colab_url: "https://colab.research.google.com"
  binderhub_url: "https://mybinder.org"

parse:
  myst_enable_extensions:
    - colon_fence
    - deflist
    - dollarmath
    - amsmath

sphinx:
  extra_extensions:
    - sphinxcontrib.mermaid
  config:
    copyright: "2026, Ujjwal"
    html_theme: sphinx_book_theme
    html_theme_options:
      show_navbar_depth: 2
      navigation_with_keys: true
    html_static_path: ["_static"]
    html_css_files: ["css/custom.css"]
    mermaid_version: "10.9.0"
    mermaid_init_config:
      startOnLoad: false
      themeVariables:
        fontSize: "20px"
      flowchart:
        useMaxWidth: false
        htmlLabels: true
